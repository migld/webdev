name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Log in to DO Container Registry
        run: doctl registry login --expiry-seconds 600

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DO_REGISTRY }}/webdev:${{ github.sha }} .
          docker tag ${{ secrets.DO_REGISTRY }}/webdev:${{ github.sha }} ${{ secrets.DO_REGISTRY }}/webdev:latest

      - name: Push image to registry
        run: |
          docker push ${{ secrets.DO_REGISTRY }}/webdev:${{ github.sha }}
          docker push ${{ secrets.DO_REGISTRY }}/webdev:latest

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            doctl registry login --expiry-seconds 600
            docker pull ${{ secrets.DO_REGISTRY }}/webdev:latest
            docker stop webdev || true
            docker rm webdev || true
            docker run -d \
              --name webdev \
              --restart always \
              -p 80:80 \
              ${{ secrets.DO_REGISTRY }}/webdev:latest
