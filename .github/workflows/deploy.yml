name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to DO Container Registry
        run: echo ${{ secrets.DO_TOKEN }} | docker login registry.digitalocean.com -u token --password-stdin

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DO_REGISTRY }}/webdev:${{ github.sha }} .
          docker tag ${{ secrets.DO_REGISTRY }}/webdev:${{ github.sha }} ${{ secrets.DO_REGISTRY }}/webdev:latest

      - name: Push image to registry
        run: |
          docker push ${{ secrets.DO_REGISTRY }}/webdev:${{ github.sha }}
          docker push ${{ secrets.DO_REGISTRY }}/webdev:latest

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSHKEY }}
          envs: DO_TOKEN,DO_REGISTRY
          script: |
            echo $DO_TOKEN | docker login registry.digitalocean.com -u token --password-stdin
            docker pull $DO_REGISTRY/webdev:latest
            docker stop webdev || true
            docker rm webdev || true
            docker run -d \
              --name webdev \
              --restart always \
              -p 80:80 \
              $DO_REGISTRY/webdev:latest
